<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Strength Checker</title>

    <!-- Font Awesome for Icons -->
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />

    <style>
        /* ---------- RESET & BASE ---------- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #0f0c29, #302b63, #24243e);
            padding: 20px;
        }

        /* ---------- CARD CONTAINER ---------- */
        .card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 32px;
            padding: 40px 36px 44px;
            max-width: 520px;
            width: 100%;
            box-shadow:
                0 30px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.07);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        /* ---------- HEADER ---------- */
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .header .icon {
            font-size: 28px;
            color: #a78bfa;
            background: rgba(167, 139, 250, 0.15);
            padding: 10px;
            border-radius: 16px;
            line-height: 1;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .header h1 span {
            color: #a78bfa;
        }

        /* ---------- INPUT GROUP ---------- */
        .input-group {
            position: relative;
            margin-bottom: 10px;
        }

        .input-group input {
            width: 100%;
            padding: 16px 52px 16px 20px;
            font-size: 17px;
            font-weight: 500;
            border: 2px solid rgba(255, 255, 255, 0.10);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.05);
            color: #f1f1f1;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            letter-spacing: 0.3px;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.30);
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        .input-group input:focus {
            border-color: #a78bfa;
            box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.15);
        }

        /* Toggle visibility button */
        .input-group .toggle-vis {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.40);
            font-size: 20px;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: color 0.25s, background 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-group .toggle-vis:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
        }

        /* ---------- STRENGTH METER ---------- */
        .meter-wrapper {
            margin: 18px 0 20px;
        }

        .meter-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .meter-fill {
            height: 100%;
            width: 0%;
            border-radius: 10px;
            background: #4ade80;
            transition: width 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
                background 0.4s ease;
        }

        /* Strength label & score */
        .strength-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .strength-label {
            font-size: 15px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.50);
            letter-spacing: 0.3px;
            transition: color 0.3s;
        }

        .strength-label strong {
            font-weight: 700;
            transition: color 0.3s;
        }

        .strength-score {
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.30);
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 14px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* ---------- CRITERIA LIST ---------- */
        .criteria {
            margin-top: 22px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .criteria-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 16px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: background 0.3s, border-color 0.3s, transform 0.2s;
        }

        .criteria-item .icon-circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.20);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .criteria-item .criteria-text {
            font-size: 15px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.45);
            transition: color 0.3s;
            letter-spacing: 0.2px;
        }

        /* ---------- MET / UNMET STATES ---------- */
        .criteria-item.met {
            background: rgba(74, 222, 128, 0.06);
            border-color: rgba(74, 222, 128, 0.12);
        }

        .criteria-item.met .icon-circle {
            background: rgba(74, 222, 128, 0.18);
            border-color: #4ade80;
            color: #4ade80;
        }

        .criteria-item.met .criteria-text {
            color: rgba(255, 255, 255, 0.80);
        }

        .criteria-item.unmet .icon-circle {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.15);
        }

        /* ---------- FOOTER ---------- */
        .footer-note {
            margin-top: 28px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.20);
            text-align: center;
            letter-spacing: 0.3px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 18px;
        }

        .footer-note i {
            margin-right: 6px;
            color: rgba(255, 255, 255, 0.15);
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 480px) {
            .card {
                padding: 28px 20px 34px;
                border-radius: 24px;
            }

            .header h1 {
                font-size: 21px;
            }

            .header .icon {
                font-size: 22px;
                padding: 8px;
            }

            .input-group input {
                font-size: 15px;
                padding: 14px 48px 14px 16px;
            }

            .criteria-item {
                padding: 8px 14px;
            }

            .criteria-item .criteria-text {
                font-size: 14px;
            }

            .strength-label {
                font-size: 14px;
            }
        }

        /* ---------- ANIMATION ---------- */
        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(6px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .criteria-item {
            animation: fadeSlide 0.35s ease both;
        }

        .criteria-item:nth-child(1) {
            animation-delay: 0.02s;
        }
        .criteria-item:nth-child(2) {
            animation-delay: 0.06s;
        }
        .criteria-item:nth-child(3) {
            animation-delay: 0.10s;
        }
        .criteria-item:nth-child(4) {
            animation-delay: 0.14s;
        }
        .criteria-item:nth-child(5) {
            animation-delay: 0.18s;
        }

        /* pulse on strength change */
        .meter-fill.pulse {
            animation: pulse 0.5s ease;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
                transform: scaleX(1);
            }
            50% {
                opacity: 0.7;
                transform: scaleX(0.98);
            }
            100% {
                opacity: 1;
                transform: scaleX(1);
            }
        }
    </style>
</head>
<body>

    <div class="card">

        <!-- HEADER -->
        <div class="header">
            <span class="icon"><i class="fas fa-shield-halved"></i></span>
            <h1>Pass<span>Guard</span></h1>
        </div>

        <!-- PASSWORD INPUT -->
        <div class="input-group">
            <input
            type="password"
            id="passwordInput"
            placeholder="Enter your password…"
            autocomplete="off"
            spellcheck="false"
            />
            <button class="toggle-vis" id="toggleBtn" aria-label="Toggle password visibility">
                <i class="fas fa-eye"></i>
            </button>
        </div>

        <!-- STRENGTH METER -->
        <div class="meter-wrapper">
            <div class="meter-track">
                <div class="meter-fill" id="meterFill"></div>
            </div>
            <div class="strength-row">
                <span class="strength-label" id="strengthLabel">
                    Strength: <strong id="strengthText">—</strong>
                </span>
                <span class="strength-score" id="strengthScore">0 / 5</span>
            </div>
        </div>

        <!-- CRITERIA -->
        <div class="criteria" id="criteriaList">
            <!-- Each item will be populated by JS, but we'll keep static fallback -->
        </div>

        <!-- FOOTER -->
        <div class="footer-note">
            <i class="fas fa-lock"></i> Real‑time validation as you type
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- DOM REFS ----------
            const input = document.getElementById('passwordInput');
            const toggleBtn = document.getElementById('toggleBtn');
            const meterFill = document.getElementById('meterFill');
            const strengthText = document.getElementById('strengthText');
            const strengthScore = document.getElementById('strengthScore');
            const criteriaContainer = document.getElementById('criteriaList');

            // ---------- CRITERIA DEFINITION ----------
            const criteriaDefs = [
                { id: 'length', label: 'At least 8 characters', test: (pwd) => pwd.length >= 8 },
                { id: 'upper', label: 'Contains uppercase letter', test: (pwd) => /[A-Z]/.test(pwd) },
                { id: 'lower', label: 'Contains lowercase letter', test: (pwd) => /[a-z]/.test(pwd) },
                { id: 'number', label: 'Contains a number', test: (pwd) => /\d/.test(pwd) },
                { id: 'special', label: 'Contains a special character', test: (pwd) => /[!@#$%^&*()_+\-=\[\]{};:'",.<>?/\\|`~]/
                    .test(pwd) },
            ];

            // Map for icon display
            const iconMap = {
                length: 'fa-text-height',
                upper: 'fa-arrow-up-a-z',
                lower: 'fa-arrow-down-a-z',
                number: 'fa-hashtag',
                special: 'fa-asterisk'
            };

            // ---------- BUILD CRITERIA DOM ----------
            function buildCriteria() {
                criteriaContainer.innerHTML = '';
                criteriaDefs.forEach((def, index) => {
                    const item = document.createElement('div');
                    item.className = 'criteria-item unmet';
                    item.dataset.criterion = def.id;

                    const iconCircle = document.createElement('span');
                    iconCircle.className = 'icon-circle';
                    iconCircle.innerHTML = `<i class="fas ${iconMap[def.id] || 'fa-circle'}"></i>`;

                    const textSpan = document.createElement('span');
                    textSpan.className = 'criteria-text';
                    textSpan.textContent = def.label;

                    item.appendChild(iconCircle);
                    item.appendChild(textSpan);
                    criteriaContainer.appendChild(item);
                });
            }
            buildCriteria();

            // Get all criteria items as a Map for quick access
            const criteriaItems = new Map();
            document.querySelectorAll('.criteria-item').forEach((el) => {
                criteriaItems.set(el.dataset.criterion, el);
            });

            // ---------- EVALUATE PASSWORD ----------
            function evaluatePassword(pwd) {
                const results = criteriaDefs.map((def) => def.test(pwd));
                const metCount = results.filter(Boolean).length;

                // Determine strength label & color
                let label = 'Weak';
                let color = '#f87171'; // red
                if (metCount === 5) {
                    label = 'Strong';
                    color = '#4ade80'; // green
                } else if (metCount >= 3) {
                    label = 'Medium';
                    color = '#fbbf24'; // yellow / amber
                } else if (metCount >= 1) {
                    label = 'Weak';
                    color = '#f87171';
                } else {
                    label = '—';
                    color = '#4b5563';
                }

                // If password is empty, show neutral
                if (pwd.length === 0) {
                    label = '—';
                    color = '#4b5563';
                }

                return { metCount, total: criteriaDefs.length, label, color, results };
            }

            // ---------- UPDATE UI ----------
            function updateUI(pwd) {
                const { metCount, total, label, color, results } = evaluatePassword(pwd);

                // 1. Meter fill
                const percent = pwd.length === 0 ? 0 : (metCount / total) * 100;
                meterFill.style.width = percent + '%';
                meterFill.style.background = color;

                // add small pulse animation
                meterFill.classList.remove('pulse');
                // force reflow
                void meterFill.offsetWidth;
                meterFill.classList.add('pulse');

                // 2. Strength label
                strengthText.textContent = label;
                strengthText.style.color = color;

                // 3. Score
                strengthScore.textContent = `${metCount} / ${total}`;

                // 4. Update each criterion
                criteriaDefs.forEach((def, idx) => {
                    const item = criteriaItems.get(def.id);
                    if (!item) return;
                    const isMet = results[idx];
                    const iconCircle = item.querySelector('.icon-circle');

                    // Toggle class
                    item.classList.toggle('met', isMet);
                    item.classList.toggle('unmet', !isMet);

                    // Update icon
                    if (isMet) {
                        iconCircle.innerHTML = `<i class="fas fa-check"></i>`;
                    } else {
                        iconCircle.innerHTML = `<i class="fas ${iconMap[def.id] || 'fa-circle'}"></i>`;
                    }
                });
            }

            // ---------- EVENT HANDLERS ----------
            function handleInput() {
                const pwd = input.value;
                updateUI(pwd);
            }

            // Toggle password visibility
            function toggleVisibility() {
                const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                input.setAttribute('type', type);
                const icon = toggleBtn.querySelector('i');
                icon.className = type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
            }

            // ---------- INITIAL STATE ----------
            // Set initial state with empty password
            updateUI('');

            // ---------- ATTACH EVENTS ----------
            input.addEventListener('input', handleInput);
            toggleBtn.addEventListener('click', toggleVisibility);

            // Also handle paste / change events for robustness
            input.addEventListener('change', handleInput);
            input.addEventListener('paste', () => {
                // delay to let the paste happen
                setTimeout(handleInput, 20);
            });

            // ---------- KEYBOARD ACCESSIBILITY ----------
            toggleBtn.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleVisibility();
                }
            });

            console.log('🔐 PassGuard initialized — real-time password strength checker.');
        })();
    </script>

</body>
</html>
